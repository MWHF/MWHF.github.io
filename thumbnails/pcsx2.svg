<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0035"/>
      <stop offset="100%" style="stop-color:#05001a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow1)"/>
  <rect width="800" height="450" fill="url(#glow2)"/>
  <!-- PS2 logo dots pattern -->
  <g opacity="0.6">
    <circle cx="160" cy="200" r="40" fill="none" stroke="#818cf8" stroke-width="3"/>
    <circle cx="160" cy="200" r="28" fill="none" stroke="#6366f1" stroke-width="2"/>
    <circle cx="160" cy="200" r="16" fill="#4f46e5" opacity="0.6"/>
    <text x="160" y="207" font-family="Arial Black, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="900" opacity="0.9">■</text>
  </g>
  <g opacity="0.6">
    <circle cx="640" cy="200" r="40" fill="none" stroke="#f9a8d4" stroke-width="3"/>
    <circle cx="640" cy="200" r="28" fill="none" stroke="#ec4899" stroke-width="2"/>
    <circle cx="640" cy="200" r="16" fill="#db2777" opacity="0.6"/>
    <text x="640" y="207" font-family="Arial Black, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="900" opacity="0.9">●</text>
  </g>
  <!-- 4K upscale visual -->
  <rect x="280" y="100" width="240" height="250" rx="8" fill="#0c0035" stroke="#4f46e5" stroke-width="2" opacity="0.8"/>
  <rect x="290" y="112" width="220" height="140" rx="4" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
  <!-- Resolution indicator -->
  <text x="400" y="185" font-family="monospace" font-size="36" font-weight="bold" fill="#a5b4fc" text-anchor="middle" opacity="0.9">4K</text>
  <text x="400" y="210" font-family="monospace" font-size="11" fill="#6366f1" text-anchor="middle" opacity="0.7">3840 × 2160 UPSCALED</text>
  <!-- Arrow up-right -->
  <line x1="340" y1="300" x2="460" y2="260" stroke="#818cf8" stroke-width="2" opacity="0.7"/>
  <polygon points="460,260 448,264 452,252" fill="#818cf8" opacity="0.7"/>
  <text x="340" y="318" font-family="monospace" font-size="9" fill="#6366f1" opacity="0.6">480p NATIVE</text>
  <text x="400" y="390" font-family="monospace" font-size="11" fill="#4f46e5" opacity="0.5" text-anchor="middle">PCSX2 1.7 NIGHTLY · PS2 EMULATION</text>
  <text x="400" y="65" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#c7d2fe" text-anchor="middle" opacity="0.95">PS2 Emulation</text>
</svg>
