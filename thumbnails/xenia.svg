<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001a00"/><stop offset="100%" style="stop-color:#030d03"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#166534;stop-opacity:0.5"/><stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- Xbox 360 ring of light -->
  <circle cx="400" cy="225" r="140" fill="none" stroke="#16a34a" stroke-width="3" opacity="0.7"/>
  <circle cx="400" cy="225" r="115" fill="none" stroke="#15803d" stroke-width="2" opacity="0.5"/>
  <circle cx="400" cy="225" r="90" fill="none" stroke="#166534" stroke-width="1.5" opacity="0.4"/>
  <!-- 4 quadrants lit up -->
  <path d="M400,225 L400,95 A130,130 0 0,1 530,225 Z" fill="#16a34a" opacity="0.25"/>
  <path d="M400,225 L530,225 A130,130 0 0,1 400,355 Z" fill="#15803d" opacity="0.2"/>
  <path d="M400,225 L400,355 A130,130 0 0,1 270,225 Z" fill="#16a34a" opacity="0.25"/>
  <path d="M400,225 L270,225 A130,130 0 0,1 400,95 Z" fill="#15803d" opacity="0.2"/>
  <!-- Center X -->
  <text x="400" y="240" font-family="Arial Black, sans-serif" font-size="60" font-weight="900" fill="#4ade80" text-anchor="middle" opacity="0.9">X</text>
  <text x="400" y="60" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#86efac" text-anchor="middle" opacity="0.95">Xbox 360</text>
  <text x="400" y="415" font-family="monospace" font-size="11" fill="#166534" text-anchor="middle" opacity="0.6">XENIA EMULATOR · SETUP &amp; CONFIGURATION</text>
</svg>
