<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0d2e"/><stop offset="100%" style="stop-color:#0d0617"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.35"/><stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- Wii remote outline -->
  <rect x="340" y="70" width="120" height="300" rx="60" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.7"/>
  <rect x="355" y="85" width="90" height="90" rx="8" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.5"/>
  <!-- A button -->
  <ellipse cx="400" cy="230" rx="25" ry="25" fill="#7c3aed" opacity="0.6"/>
  <text x="400" y="237" font-family="Arial Black" font-size="16" fill="white" text-anchor="middle" opacity="0.9" font-weight="900">A</text>
  <!-- B button strip -->
  <rect x="368" y="305" width="64" height="20" rx="10" fill="#6d28d9" opacity="0.6"/>
  <!-- D-pad -->
  <rect x="390" y="130" width="20" height="50" rx="4" fill="#5b21b6" opacity="0.5"/>
  <rect x="375" y="148" width="50" height="16" rx="4" fill="#5b21b6" opacity="0.5"/>
  <!-- HBC icon -->
  <text x="200" y="200" font-family="monospace" font-size="42" fill="#a855f7" opacity="0.5" font-weight="bold">HBC</text>
  <text x="200" y="230" font-family="monospace" font-size="11" fill="#7c3aed" opacity="0.4">Homebrew</text>
  <text x="200" y="248" font-family="monospace" font-size="11" fill="#7c3aed" opacity="0.4">Channel</text>
  <text x="400" y="55" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#c084fc" text-anchor="middle" opacity="0.95">Wii Homebrew</text>
  <text x="400" y="415" font-family="monospace" font-size="11" fill="#4c1d95" text-anchor="middle" opacity="0.6">HOMEBREW CHANNEL · PRIILOADER · CIOS</text>
</svg>
