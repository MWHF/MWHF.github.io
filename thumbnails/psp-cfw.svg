<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a00"/><stop offset="100%" style="stop-color:#0d0500"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:0.35"/><stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- PSP body outline -->
  <rect x="170" y="90" width="460" height="280" rx="30" fill="none" stroke="#f97316" stroke-width="3" opacity="0.7"/>
  <rect x="190" y="110" width="420" height="240" rx="20" fill="#1a0a00" stroke="#c2410c" stroke-width="1" opacity="0.8"/>
  <!-- Screen area -->
  <rect x="265" y="130" width="270" height="170" rx="8" fill="#0d0500" stroke="#f97316" stroke-width="2" opacity="0.7"/>
  <!-- Screen content: CFW prompt -->
  <text x="400" y="175" font-family="monospace" font-size="10" fill="#fb923c" text-anchor="middle" opacity="0.9">PRO CFW 6.61</text>
  <text x="400" y="195" font-family="monospace" font-size="9" fill="#f97316" text-anchor="middle" opacity="0.7">Fast Recovery Mode</text>
  <text x="400" y="215" font-family="monospace" font-size="8" fill="#c2410c" text-anchor="middle" opacity="0.6">VSH Menu Enabled</text>
  <text x="400" y="235" font-family="monospace" font-size="8" fill="#c2410c" text-anchor="middle" opacity="0.6">ISO/CSO Loading: ON</text>
  <text x="400" y="255" font-family="monospace" font-size="9" fill="#fb923c" text-anchor="middle" opacity="0.7">Plugins: cwCheat, NoDRM</text>
  <!-- UMD circle -->
  <circle cx="680" cy="225" r="45" fill="none" stroke="#f97316" stroke-width="2" opacity="0.5"/>
  <circle cx="680" cy="225" r="15" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.4"/>
  <!-- D-pad -->
  <rect x="215" y="195" width="14" height="40" rx="3" fill="#c2410c" opacity="0.6"/>
  <rect x="201" y="209" width="40" height="14" rx="3" fill="#c2410c" opacity="0.6"/>
  <text x="400" y="60" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#fdba74" text-anchor="middle" opacity="0.95">PSP Custom Firmware</text>
  <text x="400" y="415" font-family="monospace" font-size="11" fill="#7c2d12" text-anchor="middle" opacity="0.6">PRO CFW · PPSSPP · PLUGINS &amp; HOMEBREW</text>
