<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0019"/><stop offset="100%" style="stop-color:#0a000d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#9d174d;stop-opacity:0.4"/><stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- GPU chip outline -->
  <rect x="250" y="125" width="300" height="200" rx="10" fill="none" stroke="#e879f9" stroke-width="3" opacity="0.7"/>
  <rect x="270" y="145" width="260" height="160" rx="6" fill="#1a0019" stroke="#a21caf" stroke-width="1" opacity="0.8"/>
  <!-- Die sections -->
  <rect x="285" y="158" width="110" height="65" rx="3" fill="#2d1b3d" stroke="#a855f7" stroke-width="1" opacity="0.7"/>
  <rect x="405" y="158" width="110" height="65" rx="3" fill="#2d1b3d" stroke="#a855f7" stroke-width="1" opacity="0.7"/>
  <rect x="285" y="233" width="230" height="60" rx="3" fill="#2d1b3d" stroke="#7c3aed" stroke-width="1" opacity="0.6"/>
  <text x="340" y="195" font-family="monospace" font-size="9" fill="#e879f9" text-anchor="middle" opacity="0.8">SHADER</text>
  <text x="340" y="207" font-family="monospace" font-size="9" fill="#e879f9" text-anchor="middle" opacity="0.8">CORES</text>
  <text x="460" y="195" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle" opacity="0.8">RT / AI</text>
  <text x="400" y="268" font-family="monospace" font-size="10" fill="#a855f7" text-anchor="middle" opacity="0.8">VRAM · 16GB GDDR7</text>
  <!-- Heat indicator -->
  <text x="680" y="200" font-family="monospace" font-size="32" font-weight="bold" fill="#e879f9" text-anchor="middle" opacity="0.8">72°C</text>
  <text x="680" y="225" font-family="monospace" font-size="10" fill="#a21caf" text-anchor="middle" opacity="0.6">JUNCTION TEMP</text>
  <!-- MHz indicator -->
  <text x="120" y="200" font-family="monospace" font-size="22" font-weight="bold" fill="#e879f9" text-anchor="middle" opacity="0.8">+175</text>
  <text x="120" y="220" font-family="monospace" font-size="10" fill="#a21caf" text-anchor="middle" opacity="0.6">MHz OFFSET</text>
  <text x="400" y="60" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#f0abfc" text-anchor="middle" opacity="0.95">GPU Overclocking</text>
  <text x="400" y="415" font-family="monospace" font-size="11" fill="#4a044e" text-anchor="middle" opacity="0.6">AFTERBURNER · CURVES · EMULATION GAINS</text>
</svg>
