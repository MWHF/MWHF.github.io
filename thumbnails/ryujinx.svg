<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a0f"/>
      <stop offset="100%" style="stop-color:#050e07"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#065f46;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- Circuit board traces -->
  <g stroke="#10b981" stroke-width="1" fill="none" opacity="0.25">
    <path d="M0,100 H200 V150 H350 V100 H550 V200 H700"/>
    <path d="M0,200 H100 V250 H300 V180 H500 V250 H800"/>
    <path d="M0,320 H150 V280 H400 V340 H600 V300 H800"/>
    <path d="M100,0 V100"/><path d="M200,0 V100"/>
    <path d="M350,0 V100"/><path d="M550,100 V200"/>
    <path d="M700,200 V450"/><path d="M600,300 V450"/>
  </g>
  <!-- Circuit nodes -->
  <g fill="#10b981" opacity="0.4">
    <circle cx="200" cy="100" r="5"/><circle cx="350" cy="100" r="5"/>
    <circle cx="550" cy="100" r="5"/><circle cx="700" cy="200" r="5"/>
    <circle cx="100" cy="200" r="5"/><circle cx="300" cy="250" r="5"/>
    <circle cx="150" cy="320" r="5"/><circle cx="400" cy="340" r="5"/>
    <circle cx="600" cy="300" r="5"/>
  </g>
  <!-- Switch Joy-Con outline left -->
  <g transform="translate(155, 130)">
    <rect x="0" y="0" width="60" height="180" rx="30" fill="none" stroke="#34d399" stroke-width="3" opacity="0.7"/>
    <circle cx="30" cy="60" r="18" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.6"/>
    <circle cx="30" cy="60" r="8" fill="#10b981" opacity="0.5"/>
  </g>
  <!-- Switch screen outline -->
  <rect x="255" y="130" width="290" height="180" rx="10" fill="none" stroke="#34d399" stroke-width="3" opacity="0.7"/>
  <rect x="270" y="143" width="260" height="154" rx="6" fill="#0a1a0f" stroke="#065f46" stroke-width="1" opacity="0.9"/>
  <!-- Screen content hint -->
  <text x="400" y="228" font-family="monospace" font-size="28" fill="#10b981" text-anchor="middle" opacity="0.7" font-weight="bold">RYUJINX</text>
  <text x="400" y="250" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle" opacity="0.5">nintendo switch emulator</text>
  <!-- Switch Joy-Con outline right -->
  <g transform="translate(585, 130)">
    <rect x="0" y="0" width="60" height="180" rx="30" fill="none" stroke="#34d399" stroke-width="3" opacity="0.7"/>
    <circle cx="30" cy="120" r="18" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.6"/>
    <circle cx="30" cy="120" r="8" fill="#10b981" opacity="0.5"/>
  </g>
  <text x="400" y="390" font-family="monospace" font-size="11" fill="#065f46" opacity="0.6" text-anchor="middle">COMPLETE SETUP GUIDE · 2025</text>
  <text x="400" y="80" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#6ee7b7" text-anchor="middle" opacity="0.95">Switch Emulation</text>
</svg>
